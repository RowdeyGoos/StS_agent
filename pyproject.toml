[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sts-agent"
version = "0.1.0"
description = "Independent Slay the Spire 2 headless game engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
sts-headless-play = "game.cli.headless_play:main"

[tool.setuptools.packages.find]
include = ["game*"]
