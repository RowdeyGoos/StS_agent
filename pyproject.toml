[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sts-agent"
version = "0.1.0"
description = "Independent Slay the Spire 2 headless game engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gym = [
    "gymnasium>=1.0,<2.0",
    "numpy>=1.24,<3.0",
]
dev = [
    "pytest>=8.0,<9.0",
]
tracking = [
    "mlflow>=3.16,<3.17",
]
train = [
    "gymnasium>=1.0,<2.0",
    "numpy>=1.24,<3.0",
    "torch>=2.13,<2.14",
]

[project.scripts]
sts-headless-play = "game.cli.headless_play:main"
sts-agent-play = "game.cli.agent_play:main"
sts-agent-evaluate = "game.cli.agent_evaluate:main"
sts-agent-train = "game.cli.agent_train:main"
sts-agent-analyze = "game.cli.agent_analyze:main"
sts-agent-track = "game.cli.agent_track:main"

[tool.setuptools.package-data]
"game.agent.analysis" = ["assets/*.html", "assets/*.js", "assets/*.css"]

[tool.setuptools.packages.find]
include = ["game*"]
